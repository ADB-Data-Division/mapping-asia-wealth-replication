[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maw"
version = "0.2.0"
description = "Mapping Asia's Wealth."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "kornia>=0.7",
  "matplotlib>=3.8",
  "numpy>=1.24",
  "pandas>=1.5",
  "rasterio>=1.3",
  "scikit-learn>=1.7",
  "torch>=2.6",
  "torchgeo>=0.7",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.4",
  "pytest>=7.4",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "B",   # flake8-bugbear
  "UP",  # pyupgrade,
  'NPY', # numpy
  'PD',  # pandas
]
ignore = [
	"I",
    "E501",   # line too long
]
